<div class="card">
  <header>
    <h2>Change admin password</h2>
    <p>All devices will be logged out after you change your password.</p>
  </header>
  <section>
    <form method="post" action="/settings/password" hx-boost="false" class="grid gap-4">
      {% if let Some(e) = password_error %}{{ m::alert(e, "", "") }}{% endif %}
      <div role="group" class="field">
        <label for="current-password">Current password</label>
        <input id="current-password" class="input" type="password" name="current_password" autocomplete="current-password" required {% if password_autofocus %}autofocus{% endif %}>
      </div>
      <div role="group" class="field">
        <label for="password">New password</label>
        <input id="password" class="input" type="password" name="password" autocomplete="new-password" pattern="\S+" required>
        <p>12 to 128 characters, no spaces. Easy-to-guess and leaked passwords are refused.</p>
      </div>
      <div role="group" class="field">
        <label for="confirm">Repeat new password</label>
        <input id="confirm" class="input" type="password" name="confirm" autocomplete="new-password" pattern="\S+" required>
      </div>
      <div class="flex gap-2">
        <button type="submit" class="btn">Change password</button>
        <a class="btn" data-variant="outline" href="/settings?tab=security">Cancel</a>
      </div>
    </form>
  </section>
</div>
