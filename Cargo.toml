[package]
name = "stalias"
version = "0.1.2"
edition = "2024"
license = "AGPL-3.0-only"
description = "Bitwarden/Addy.io-compatible alias manager for Stalwart Mail Server"
readme = "README.md"
keywords = ["stalwart", "email", "alias", "bitwarden", "addy"]
categories = ["web-programming::http-server"]
publish = false

[dependencies]
argon2 = "0.6.0"
askama = "0.16.1"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie", "form"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "net", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
